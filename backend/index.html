<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiQC — Inline Vision Inspection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A;
    --panel:#171D26;
    --border:#262F3D;
    --border-soft:#1F2733;
    --text:#E7ECF2;
    --text-dim:#8792A2;
    --text-faint:#59637E;
    --accent:#3FD0C9;
    --accent-dim:rgba(63,208,201,0.14);
    --pass:#46D18A;
    --fail:#E2574C;
    --warn:#F0A93E;
    --radius-sm:4px;
    --radius:9px;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    --sans:'Space Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      linear-gradient(var(--border-soft) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--border-soft) 1px, transparent 1px) 0 0/28px 100%,
      var(--bg);
    background-blend-mode:overlay;
    background-color:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:28px 20px 60px;
  }
  .app{max-width:980px;margin:0 auto;}

  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;flex-wrap:wrap;gap:10px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand-name{font-weight:700;font-size:1.35rem;letter-spacing:0.02em;}
  .brand-sub{color:var(--text-dim);font-size:0.85rem;}
  .conn{display:flex;align-items:center;font-family:var(--mono);font-size:0.8rem;color:var(--text-dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);display:inline-block;margin-right:7px;transition:background .2s;}
  .dot.online{background:var(--pass);box-shadow:0 0 6px var(--pass);}
  .dot.offline{background:var(--fail);box-shadow:0 0 6px var(--fail);}

  .grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;}
  @media (max-width:860px){.grid{grid-template-columns:1fr;}}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
  }

  .viewport-panel{display:flex;flex-direction:column;gap:14px;}
  .viewport{
    position:relative;
    min-height:320px;
    border:1px dashed var(--border);
    border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:pointer;
    background:rgba(255,255,255,0.012);
    outline:none;
  }
  .viewport.has-image{cursor:default;border-style:solid;border-color:var(--border-soft);}
  .viewport.dragging{border-color:var(--accent);background:var(--accent-dim);}
  .viewport:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .empty-state{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-dim);padding:30px;text-align:center;}
  .empty-state svg{opacity:0.6;}
  .empty-state .et-main{font-size:0.95rem;color:var(--text);}
  .empty-state .et-sub{font-size:0.78rem;color:var(--text-faint);}

  canvas{max-width:100%;height:auto;display:block;}

  .clear-btn{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:var(--radius-sm);
    background:rgba(16,20,26,0.72);border:1px solid var(--border);
    color:var(--text-dim);font-family:var(--sans);font-size:0.95rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .clear-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .scan-line{
    position:absolute;left:0;right:0;top:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow:0 0 10px var(--accent);
    animation:scan 1.3s linear infinite;
  }
  @keyframes scan{0%{transform:translateY(0);}100%{transform:translateY(320px);}}
  @media (prefers-reduced-motion: reduce){.scan-line{animation:none;top:50%;}}

  .viewport-controls{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .view-toggle{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;}
  .view-toggle button{
    font-family:var(--sans);font-size:0.8rem;padding:7px 13px;
    background:transparent;border:none;color:var(--text-dim);cursor:pointer;
  }
  .view-toggle button.active{background:var(--accent-dim);color:var(--accent);}
  .view-toggle button:not(:last-child){border-right:1px solid var(--border);}

  .opacity-wrap{display:flex;align-items:center;gap:8px;color:var(--text-faint);font-size:0.75rem;font-family:var(--mono);}
  input[type=range]{accent-color:var(--accent);width:100px;}

  .primary-btn{
    background:var(--accent);color:#08201E;font-weight:600;font-family:var(--sans);
    font-size:0.9rem;padding:10px 20px;border-radius:var(--radius-sm);border:none;
    cursor:pointer;transition:filter .15s;
  }
  .primary-btn:hover:not(:disabled){filter:brightness(1.08);}
  .primary-btn:disabled{background:var(--border-soft);color:var(--text-faint);cursor:not-allowed;}

  .readout-panel{display:flex;flex-direction:column;}
  .readout-block{padding:14px 0;border-bottom:1px solid var(--border-soft);}
  .readout-block:first-child{padding-top:0;}
  .readout-block:last-child{border-bottom:none;padding-bottom:0;}
  .label{font-size:0.72rem;letter-spacing:0.03em;color:var(--text-dim);margin-bottom:7px;}

  .status-badge{
    font-family:var(--mono);font-weight:600;font-size:1.05rem;
    padding:7px 14px;border-radius:var(--radius-sm);display:inline-block;
    border:1px solid var(--border-soft);color:var(--text-faint);
  }
  .status-badge.pass{color:var(--pass);border-color:var(--pass);background:rgba(70,209,138,0.08);}
  .status-badge.fail{color:var(--fail);border-color:var(--fail);background:rgba(226,87,76,0.08);}

  .mono-value{font-family:var(--mono);font-size:1.55rem;color:var(--text);}
  .mono-value.small{font-size:1rem;}

  .gauge{position:relative;height:6px;background:var(--border-soft);border-radius:3px;margin-top:10px;}
  .gauge-fill{height:100%;width:0%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--pass));transition:width .45s ease, background .3s ease;}
  .gauge-marker{position:absolute;top:-4px;left:0%;width:2px;height:14px;background:var(--text-dim);}

  .mono-input{
    width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);
    font-family:var(--mono);font-size:0.92rem;padding:9px 10px;border-radius:var(--radius-sm);
  }
  .mono-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent;}

  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .error-msg{
    margin-top:14px;background:rgba(226,87,76,0.08);border:1px solid var(--fail);
    color:#F3ABA6;padding:11px 13px;border-radius:var(--radius-sm);font-size:0.82rem;line-height:1.45;
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-name">OPTIQC</span>
      <span class="brand-sub">Inline Vision Inspection</span>
    </div>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connText">checking backend…</span></div>
  </header>

  <div class="grid">
    <section class="panel viewport-panel">
      <div class="viewport" id="dropzone" tabindex="0" role="button" aria-label="Upload an image to inspect">
        <div class="empty-state" id="emptyState">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="17" stroke="#8792A2" stroke-width="1.4"/>
            <circle cx="20" cy="20" r="5.5" stroke="#8792A2" stroke-width="1.4"/>
            <line x1="20" y1="1.5" x2="20" y2="8" stroke="#8792A2" stroke-width="1.4"/>
            <line x1="20" y1="32" x2="20" y2="38.5" stroke="#8792A2" stroke-width="1.4"/>
            <line x1="1.5" y1="20" x2="8" y2="20" stroke="#8792A2" stroke-width="1.4"/>
            <line x1="32" y1="20" x2="38.5" y2="20" stroke="#8792A2" stroke-width="1.4"/>
          </svg>
          <div class="et-main">Drop an image here or click to browse</div>
          <div class="et-sub">PNG or JPG · sent to the inspection endpoint as-is</div>
        </div>
        <canvas id="canvas" hidden></canvas>
        <div class="scan-line" id="scanLine" hidden></div>
        <button class="clear-btn" id="clearBtn" hidden aria-label="Remove image">×</button>
        <input type="file" id="fileInput" accept="image/*" hidden>
      </div>

      <div class="viewport-controls">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
          <div class="view-toggle" id="viewToggle" hidden>
            <button data-view="original" class="active" type="button">Original</button>
            <button data-view="heatmap" type="button">Heatmap</button>
          </div>
          <div class="opacity-wrap" id="opacityWrap" hidden>
            overlay
            <input type="range" id="opacitySlider" min="0" max="100" value="65">
          </div>
        </div>
        <button class="primary-btn" id="inspectBtn" disabled>Run Inspection</button>
      </div>
    </section>

    <aside class="panel readout-panel">
      <div class="readout-block">
        <div class="label">status</div>
        <div class="status-badge" id="statusBadge">—</div>
      </div>

      <div class="readout-block">
        <div class="label">anomaly score</div>
        <div class="mono-value" id="scoreValue">—</div>
        <div class="gauge"><div class="gauge-fill" id="gaugeFill"></div><div class="gauge-marker" id="gaugeMarker"></div></div>
      </div>

      <div class="readout-block">
        <div class="label">threshold (editable — sent with next inspection)</div>
        <input type="number" step="0.0001" class="mono-input" id="thresholdInput" placeholder="—">
      </div>

      <div class="readout-block two-col">
        <div>
          <div class="label">defect type</div>
          <div class="mono-value small" id="defectValue">—</div>
        </div>
        <div>
          <div class="label">latency</div>
          <div class="mono-value small" id="latencyValue">—</div>
        </div>
      </div>

      <div class="readout-block">
        <div class="label">api endpoint</div>
        <input type="text" class="mono-input" id="apiInput" value="">
      </div>

      <div class="error-msg" id="errorMsg" hidden></div>
    </aside>
  </div>
</div>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const emptyState = document.getElementById('emptyState');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const fileInput = document.getElementById('fileInput');
  const clearBtn = document.getElementById('clearBtn');
  const scanLine = document.getElementById('scanLine');
  const viewToggle = document.getElementById('viewToggle');
  const opacityWrap = document.getElementById('opacityWrap');
  const opacitySlider = document.getElementById('opacitySlider');
  const inspectBtn = document.getElementById('inspectBtn');
  const statusBadge = document.getElementById('statusBadge');
  const scoreValue = document.getElementById('scoreValue');
  const gaugeFill = document.getElementById('gaugeFill');
  const gaugeMarker = document.getElementById('gaugeMarker');
  const thresholdInput = document.getElementById('thresholdInput');
  const defectValue = document.getElementById('defectValue');
  const latencyValue = document.getElementById('latencyValue');
  const apiInput = document.getElementById('apiInput');
  const errorMsg = document.getElementById('errorMsg');
  const connDot = document.getElementById('connDot');
  const connText = document.getElementById('connText');

  let currentFile = null;
  let originalImg = null;
  let heatmapImg = null;
  let currentView = 'original';
  let thresholdTouched = false;
  let objectUrl = null;

  // If left blank, default to this page's own origin — this makes the demo
  // work immediately once it's hosted alongside the API (e.g. on the same
  // Hugging Face Space), with no manual configuration needed.
  if(!apiInput.value.trim()) apiInput.value = window.location.origin;

  function apiBase(){ return apiInput.value.trim().replace(/\/+$/,''); }

  function checkBackend(){
    connDot.className = 'dot';
    connText.textContent = 'checking backend…';
    fetch(apiBase() + '/', { method:'GET' })
      .then(r => { if(!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        connDot.className = 'dot online';
        connText.textContent = 'online · threshold ' + Number(data.threshold).toFixed(4);
        if(!thresholdTouched) thresholdInput.value = data.threshold;
      })
      .catch(() => {
        connDot.className = 'dot offline';
        connText.textContent = 'backend unreachable';
      });
  }

  apiInput.addEventListener('change', checkBackend);
  thresholdInput.addEventListener('input', () => { thresholdTouched = true; });

  // --- Upload handling ---
  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fileInput.click(); }
  });
  ['dragenter','dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.add('dragging');
  }));
  ['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.remove('dragging');
  }));
  dropzone.addEventListener('drop', e => {
    if(e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if(fileInput.files[0]) handleFile(fileInput.files[0]);
  });
  clearBtn.addEventListener('click', e => { e.stopPropagation(); resetAll(); });

  function handleFile(file){
    if(!file.type.startsWith('image/')){
      showError('That file isn\'t an image. Choose a PNG or JPG.');
      return;
    }
    hideError();
    currentFile = file;
    heatmapImg = null;
    currentView = 'original';
    setActiveViewBtn('original');
    viewToggle.hidden = true;
    opacityWrap.hidden = true;

    if(objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      originalImg = img;
      loadImageToCanvas(img);
      emptyState.hidden = true;
      canvas.hidden = false;
      clearBtn.hidden = false;
      dropzone.classList.add('has-image');
      inspectBtn.disabled = false;
      resetReadouts();
    };
    img.src = objectUrl;
  }

  function loadImageToCanvas(img){
    const maxDim = 1100;
    let w = img.naturalWidth, h = img.naturalHeight;
    if(w > maxDim || h > maxDim){
      const scale = Math.min(maxDim/w, maxDim/h);
      w = Math.round(w*scale); h = Math.round(h*scale);
    }
    canvas.width = w; canvas.height = h;
    renderComposite();
  }

  function resetAll(){
    currentFile = null; originalImg = null; heatmapImg = null;
    if(objectUrl) URL.revokeObjectURL(objectUrl);
    canvas.hidden = true; emptyState.hidden = false; clearBtn.hidden = true;
    dropzone.classList.remove('has-image');
    viewToggle.hidden = true; opacityWrap.hidden = true;
    inspectBtn.disabled = true;
    resetReadouts();
    hideError();
  }

  function resetReadouts(){
    statusBadge.textContent = '—'; statusBadge.className = 'status-badge';
    scoreValue.textContent = '—'; defectValue.textContent = '—'; latencyValue.textContent = '—';
    gaugeFill.style.width = '0%'; gaugeMarker.style.left = '0%';
  }

  // --- View toggle ---
  viewToggle.addEventListener('click', e => {
    const btn = e.target.closest('button[data-view]');
    if(!btn) return;
    currentView = btn.dataset.view;
    setActiveViewBtn(currentView);
    renderComposite();
  });
  function setActiveViewBtn(view){
    viewToggle.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  }
  opacitySlider.addEventListener('input', renderComposite);

  // --- Heatmap colorization + compositing ---
  function colorizeHeatmap(img, w, h, opacity){
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const octx = off.getContext('2d');
    octx.drawImage(img, 0, 0, w, h);
    const data = octx.getImageData(0, 0, w, h);
    const d = data.data;
    for(let i=0; i<d.length; i+=4){
      const t = d[i] / 255; // grayscale intensity
      let r,g,b;
      if(t < 0.5){
        const k = t/0.5;
        r = lerp(63,240,k); g = lerp(208,169,k); b = lerp(201,62,k);
      } else {
        const k = (t-0.5)/0.5;
        r = lerp(240,226,k); g = lerp(169,87,k); b = lerp(62,76,k);
      }
      d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3] = Math.pow(t,1.25)*255*opacity;
    }
    octx.putImageData(data, 0, 0);
    return off;
  }
  function lerp(a,b,k){ return a + (b-a)*k; }

  function renderComposite(){
    if(!originalImg) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height);
    if(currentView === 'heatmap' && heatmapImg){
      const colored = colorizeHeatmap(heatmapImg, canvas.width, canvas.height, opacitySlider.value/100);
      ctx.drawImage(colored, 0, 0);
    }
  }

  // --- Inspection call ---
  inspectBtn.addEventListener('click', runInspection);

  function runInspection(){
    if(!currentFile) return;
    hideError();
    inspectBtn.disabled = true;
    inspectBtn.textContent = 'Inspecting…';
    scanLine.hidden = false;

    const form = new FormData();
    form.append('file', currentFile);
    if(thresholdInput.value !== '') form.append('threshold', thresholdInput.value);

    fetch(apiBase() + '/api/v1/inspect', { method:'POST', body: form })
      .then(r => {
        if(!r.ok) throw new Error('API returned ' + r.status);
        return r.json();
      })
      .then(updateResults)
      .catch(err => {
        showError('Couldn\'t reach the inspection API (' + err.message + '). Make sure the FastAPI server is running at ' + apiBase() + ', and that this page is open over http:// rather than saved as a local file.');
      })
      .finally(() => {
        inspectBtn.disabled = false;
        inspectBtn.textContent = 'Run Inspection';
        scanLine.hidden = true;
      });
  }

  function updateResults(data){
    statusBadge.textContent = data.is_defective ? 'FAIL' : 'PASS';
    statusBadge.className = 'status-badge ' + (data.is_defective ? 'fail' : 'pass');
    scoreValue.textContent = Number(data.image_score).toFixed(4);
    defectValue.textContent = data.defect_type;
    latencyValue.textContent = Number(data.latency_ms).toFixed(1) + ' ms';
    if(!thresholdTouched) thresholdInput.value = data.threshold;

    const scaleMax = Math.max(data.image_score, data.threshold) * 1.25 || 1;
    const fillPct = Math.min(data.image_score / scaleMax * 100, 100);
    const markerPct = Math.min(data.threshold / scaleMax * 100, 100);
    gaugeFill.style.width = fillPct + '%';
    gaugeFill.style.background = data.is_defective
      ? 'linear-gradient(90deg, var(--warn), var(--fail))'
      : 'linear-gradient(90deg, var(--accent), var(--pass))';
    gaugeMarker.style.left = markerPct + '%';

    const hImg = new Image();
    hImg.onload = () => {
      heatmapImg = hImg;
      viewToggle.hidden = false;
      opacityWrap.hidden = false;
      currentView = 'heatmap';
      setActiveViewBtn('heatmap');
      renderComposite();
    };
    hImg.src = 'data:image/png;base64,' + data.heatmap_base64;
  }

  function showError(msg){ errorMsg.textContent = msg; errorMsg.hidden = false; }
  function hideError(){ errorMsg.hidden = true; }

  checkBackend();
})();
</script>
</body>
</html>
